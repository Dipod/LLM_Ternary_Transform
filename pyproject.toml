# Tooling configuration for LLM_Ternary_Transform.
# Python 3.10+ (AGENTS.md -> Project info). Runtime dependencies live in requirements.txt;
# local gate tooling in requirements-dev.txt.
# Gate chain: ruff check -> ruff format --check -> mypy -> pytest
# (.kilo/rules/verification-gates.md).

[tool.ruff]
line-length = 100
# The pinned runtime stack raises the effective floor: numpy 2.5.3 requires Python
# 3.12+ (requires-python metadata), so the tooling targets 3.12 rather than 3.10.
target-version = "py312"
# "*.md" is excluded because ruff 0.16 reformats Python code blocks inside Markdown;
# PROJECT_PLAN.md and PHASE0_*.md are human-owned plan-of-record documents (AGENTS.md).
extend-exclude = [".kilo/worktrees", "results", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.pep8-naming]
# Numerical code uses the matrix/vector names fixed by design.md (X, W, W_hat, A, B,
# C, D, U, V) and the operator names T_tau / T_tau_cols taken from the primary source.
# F is the conventional alias for torch.nn.functional.
ignore-names = ["X", "W", "W_hat", "A", "B", "C", "D", "U", "V", "I", "T_tau", "T_tau_cols", "F"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
# numpy 2.5.3 requires Python 3.12+ and its stubs use PEP 695 syntax, so the type
# target is 3.12 (the project venv is 3.14).
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_reexport = true
exclude = ["^\\.venv/", "^\\.kilo/worktrees/", "^results/"]

# Third-party packages without type stubs are narrowed at the boundary
# (phase0_feasibility/calibration/loader.py); do not fail the gate on them.
[[tool.mypy.overrides]]
module = ["transformers.*", "datasets.*", "yaml.*", "torchao.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q -m 'not network'"
markers = [
    "network: requires downloading a HuggingFace model or dataset; excluded from the default gate chain",
]
# The phase0_feasibility package lives at the repository root; make it importable
# from tests without installing it.
pythonpath = ["."]
